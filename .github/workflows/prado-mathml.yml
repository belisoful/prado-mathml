name: PRADO Math Extension
on: [push, pull_request, workflow_dispatch]
jobs:
  composerext:
    name: Math (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.2', '8.3', '8.4', '8.5']

    defaults:
      run:
        working-directory: prado-mathml

    steps:
      - name: Checkout extension
        uses: actions/checkout@v5
        with:
          path: prado-mathml

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: ctype, dom, intl, json, mbstring, pcre, spl
          # php-cs-fixer and phpstan run from vendor/bin, at the versions composer.json pins.
          tools: cs2pr
          coverage: pcov

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-${{ hashFiles('prado-mathml/composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-versions }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Validate code syntax using php-cs-fixer
        run: vendor/bin/php-cs-fixer fix src -vvv --dry-run --using-cache=no --format=checkstyle | cs2pr

      - name: Validate test syntax using php-cs-fixer
        run: vendor/bin/php-cs-fixer fix tests -vvv --dry-run --using-cache=no --format=checkstyle | cs2pr

      - name: Validate code using phpstan
        run: vendor/bin/phpstan analyse --memory-limit=1G --error-format=checkstyle | cs2pr

      - name: Run Unit Tests with coverage
        run: vendor/bin/phpunit --testsuite unit --coverage-clover build/logs/clover.xml

      - name: Enforce coverage
        run: php tests/test_tools/coverage-gate.php build/logs/clover.xml

  branches:
    # Branch coverage lives beside the rest of CI rather than in its own workflow, but it
    # cannot run on every push: instrumenting every branch is far slower than the suite.
    # It runs where it pays for itself — on a pull request, on a commit that lands on main,
    # and on demand — so a failure always names the change that caused it. Line coverage
    # above says a line ran; this says the decision on it went both ways.
    name: Branch coverage
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: prado-mathml

    steps:
      - name: Checkout extension
        uses: actions/checkout@v5
        with:
          path: prado-mathml

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ctype, dom, intl, json, mbstring, pcre, spl
          # Branch data comes from xdebug; pcov records lines only.
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Measure branch coverage
        env:
          XDEBUG_MODE: coverage
        run: php -d memory_limit=2G vendor/bin/phpunit --testsuite unit --path-coverage --coverage-php build/logs/coverage.php

      - name: Enforce branch coverage
        run: php -d memory_limit=1G tests/test_tools/branch-gate.php build/logs/coverage.php
